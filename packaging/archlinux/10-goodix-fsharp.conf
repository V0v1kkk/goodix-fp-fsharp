# /etc/systemd/system/fprintd.service.d/10-goodix-fsharp.conf
# Systemd drop-in override for stock fprintd.service (Arch fprintd package)
# Redirects the net.reactivated.Fprint D-Bus service to our pure F# Goodix daemon.
#
# Hardening rationale & compatibility:
# 1. ExecStart:
#    Reset the default stock ExecStart (/usr/lib/fprintd) and launch our
#    Native AOT daemon binary (/usr/lib/goodix-fp/goodix-fprintd daemon).
#
# 2. StateDirectory:
#    Stock uses StateDirectory=fprint (/var/lib/fprint). We override this to
#    goodix-fp, which ensures systemd provisions /var/lib/goodix-fp with mode
#    0700 (root:root) and grants write access under ProtectSystem=strict.
#
# 3. Filesystem isolation (ProtectSystem=strict, ProtectHome=true, PrivateTmp=true):
#    - ProtectSystem=strict mounts /usr as read-only, which perfectly allows
#      loading /usr/lib/goodix-fp/goodix-fprintd and the proprietary matcher blob
#      /usr/lib/goodix-fp/libgoodix_tod_53xc.so while preventing modifications.
#    - ProtectHome=true is strictly retained so the daemon CANNOT read user home
#      directories. All templates must be imported into /var/lib/goodix-fp/templates/.
#    - PrivateTmp=true provides private /tmp namespace isolation.
#
# 4. USB hardware access (DeviceAllow=char-usb_device rw, ReadWritePaths=/sys/devices):
#    Retained from stock fprintd.service. Grants access to /dev/bus/usb character
#    devices and allows USB power management and persist parameter configuration.
#
# 5. Memory execution policy (MemoryDenyWriteExecute=true):
#    Stock sets MemoryDenyWriteExecute=true (PR_SET_MDWE). .NET Native AOT
#    compiles directly to ELF native code ahead-of-time without a runtime JIT,
#    and libgoodix_tod_53xc.so contains no TEXTRELs or executable stacks (RW stack only).
#    Retaining MDWE provides strong defense-in-depth against code injection.

[Service]
# Reset stock binary and point to Goodix F# Native AOT daemon
ExecStart=
ExecStart=/usr/lib/goodix-fp/goodix-fprintd daemon

# Dedicated biometric template state directory (/var/lib/goodix-fp)
StateDirectory=
StateDirectory=goodix-fp
StateDirectoryMode=0700
